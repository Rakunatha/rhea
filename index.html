<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FOMO Among Young Adults — Rhea Ajith George</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0e16;
    --bg-2:#15151f;
    --panel:#191a26;
    --panel-2:#20212f;
    --line: rgba(245,243,250,0.10);
    --text:#f5f3fa;
    --muted:#9997b3;
    --violet:#7b61ff;
    --violet-soft: rgba(123,97,255,0.16);
    --coral:#ff5d6c;
    --mint:#5eead4;
    --amber:#ffc857;
    --story-track: rgba(245,243,250,0.16);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    overscroll-behavior:none;
    -webkit-tap-highlight-color: transparent;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .display{font-family:'Space Grotesk', sans-serif;}

  /* ambient glow */
  #app{
    position:fixed; inset:0;
    overflow:hidden;
    background:
      radial-gradient(60vmax 60vmax at 12% -10%, rgba(123,97,255,0.20), transparent 60%),
      radial-gradient(50vmax 50vmax at 105% 15%, rgba(255,93,108,0.14), transparent 55%),
      radial-gradient(70vmax 70vmax at 50% 120%, rgba(94,234,212,0.08), transparent 60%),
      var(--bg);
  }

  /* ---------- Story progress bar ---------- */
  #storybar{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    gap:6px;
    padding: clamp(10px,2.2vh,18px) clamp(12px,3vw,28px) 0;
    z-index:40;
  }
  .seg{
    flex:1;
    height:4px;
    background:var(--story-track);
    border-radius:3px;
    overflow:hidden;
    cursor:pointer;
    position:relative;
  }
  .seg::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0;
    width:0%;
    background: linear-gradient(90deg, var(--violet), var(--coral));
    border-radius:3px;
    transition: width .18s linear;
  }
  .seg.done::before{ width:100%; }
  .seg.active::before{ width:var(--fill,0%); }

  #topbar{
    position:absolute;
    top: clamp(24px,4.6vh,36px);
    left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 0 clamp(12px,3vw,28px);
    z-index:40;
    pointer-events:none;
  }
  #topbar .brand{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size: clamp(11px,1.3vw,13px);
    letter-spacing:.06em;
    color:var(--muted);
    text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
  }
  #topbar .brand .dot{width:6px;height:6px;border-radius:50%;background:var(--coral);box-shadow:0 0 10px var(--coral);}
  #topbar .counter{
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(11px,1.3vw,13px);
    color:var(--muted);
    pointer-events:auto;
  }
  #topbar .counter b{color:var(--text);}

  /* ---------- Slide viewport ---------- */
  #viewport{
    position:absolute;
    inset:0;
    top: clamp(52px,9vh,76px);
    bottom: clamp(56px,9vh,84px);
  }
  .slide{
    position:absolute; inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: clamp(18px,4vh,40px) clamp(20px,7vw,120px);
    opacity:0;
    transform: translateX(40px) scale(.985);
    transition: opacity .45s cubic-bezier(.22,.61,.36,1), transform .45s cubic-bezier(.22,.61,.36,1);
    pointer-events:none;
    overflow-y:auto;
  }
  .slide::-webkit-scrollbar{width:0;height:0;}
  .slide.active{
    opacity:1;
    transform: translateX(0) scale(1);
    pointer-events:auto;
    z-index:5;
  }
  .slide.prev{
    transform: translateX(-40px) scale(.985);
  }
  .slide-inner{ width:100%; max-width:1180px; margin:0 auto; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(11px,1.3vw,13px);
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--violet);
    display:flex; align-items:center; gap:10px;
    margin-bottom: clamp(10px,2vh,18px);
  }
  .eyebrow::before{
    content:"";
    width:22px; height:1px;
    background:var(--violet);
    display:inline-block;
  }
  h1.slide-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size: clamp(28px, 5vw, 56px);
    line-height:1.06;
    margin: 0 0 clamp(12px,2.2vh,22px);
    letter-spacing:-0.01em;
  }
  h1.slide-title .accent{color:var(--coral);}
  p.lede{
    font-size: clamp(14px,1.9vw,19px);
    line-height:1.6;
    color:var(--muted);
    max-width:64ch;
    margin:0 0 clamp(14px,2.4vh,26px);
  }

  /* ---------- title slide ---------- */
  .title-slide{ text-align:left; }
  .title-slide .kicker{
    font-family:'IBM Plex Mono',monospace;
    color:var(--mint);
    font-size:clamp(11px,1.4vw,14px);
    letter-spacing:.16em;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .title-slide h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(32px,7vw,78px);
    line-height:1.02;
    letter-spacing:-0.015em;
    margin:0 0 18px;
  }
  .title-slide h1 span{color:var(--violet);}
  .title-slide .sub{
    font-size:clamp(15px,2.1vw,21px);
    color:var(--muted);
    max-width:58ch;
    margin-bottom:clamp(24px,4vh,48px);
  }
  .author-row{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .avatar{
    width:46px;height:46px;border-radius:50%;
    background:linear-gradient(135deg,var(--violet),var(--coral));
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;
    flex-shrink:0;
  }
  .author-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:clamp(15px,1.8vw,18px);}
  .author-role{color:var(--muted); font-size:clamp(12px,1.4vw,14px);}
  .badge-row{display:flex; gap:10px; margin-top:clamp(20px,3.5vh,34px); flex-wrap:wrap;}
  .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:clamp(10.5px,1.2vw,12.5px);
    padding:7px 12px;
    border:1px solid var(--line);
    border-radius:100px;
    color:var(--muted);
    background:rgba(255,255,255,0.02);
  }

  /* ---------- stat blocks (abstract) ---------- */
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
    margin-top:clamp(14px,2.6vh,24px);
  }
  .stat-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:clamp(16px,2.2vw,22px);
  }
  .stat-card .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); margin-bottom:8px;
  }
  .stat-card .value{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:clamp(22px,2.6vw,30px);
    color:var(--text);
    margin-bottom:6px;
  }
  .stat-card .value.violet{color:var(--violet);}
  .stat-card .value.coral{color:var(--coral);}
  .stat-card .value.mint{color:var(--mint);}
  .stat-card p{margin:0; font-size:clamp(12.5px,1.4vw,14.5px); color:var(--muted); line-height:1.5;}

  /* ---------- numbered objectives ---------- */
  .obj-list{ list-style:none; margin:clamp(10px,2vh,18px) 0 0; padding:0; display:flex; flex-direction:column; gap:12px;}
  .obj-list li{
    display:flex; gap:16px; align-items:flex-start;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:clamp(14px,1.8vw,18px) clamp(16px,2vw,20px);
  }
  .obj-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px; color:var(--violet);
    border:1px solid rgba(123,97,255,0.4);
    background:var(--violet-soft);
    border-radius:8px;
    width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .obj-list p{margin:0; font-size:clamp(13.5px,1.5vw,15.5px); line-height:1.55; color:var(--text);}

  /* ---------- two column ---------- */
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(20px,3vw,40px); align-items:start;}
  @media (max-width:760px){ .two-col{grid-template-columns:1fr;} }

  .pillbox{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:clamp(16px,2.2vw,22px);
  }
  .pillbox h3{
    font-family:'Space Grotesk',sans-serif; font-size:clamp(14px,1.6vw,17px);
    margin:0 0 10px; color:var(--mint);
  }
  .pillbox p, .pillbox li{ font-size:clamp(13px,1.45vw,15px); color:var(--muted); line-height:1.6;}
  .pillbox ul{margin:0; padding-left:18px;}

  /* ---------- methodology chips ---------- */
  .chip-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-top:16px;}
  .chip{
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px;
  }
  .chip .k{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em; color:var(--amber); text-transform:uppercase; margin-bottom:6px;}
  .chip .v{font-size:13.5px; color:var(--text); line-height:1.5;}

  /* ---------- data / chart slides ---------- */
  .data-slide{ display:grid; grid-template-columns:1.05fr 0.95fr; gap:clamp(20px,3.4vw,48px); align-items:center; width:100%;}
  @media (max-width:820px){
    .data-slide{grid-template-columns:1fr; gap:18px;}
    .data-slide .chart-card{order:1;}
    .data-slide .data-copy{order:2;}
  }
  .data-copy .fignum{
    font-family:'IBM Plex Mono',monospace; color:var(--coral); font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:10px;
  }
  .data-copy h2{
    font-family:'Space Grotesk',sans-serif; font-weight:600;
    font-size:clamp(20px,2.6vw,30px); line-height:1.2; margin:0 0 14px;
  }
  .data-copy .question{
    font-size:clamp(13px,1.5vw,15px); color:var(--muted); line-height:1.6; margin-bottom:18px;
    border-left:2px solid var(--violet); padding-left:14px;
  }
  .headline-stat{ display:flex; align-items:baseline; gap:10px; margin-bottom:14px;}
  .headline-stat .num{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(38px,5vw,64px); color:var(--violet); line-height:1;}
  .headline-stat .desc{ font-size:clamp(12.5px,1.4vw,14.5px); color:var(--muted); max-width:26ch; line-height:1.4;}
  .insight{
    font-size:clamp(12.5px,1.4vw,14.5px); color:var(--text); background:var(--violet-soft);
    border:1px solid rgba(123,97,255,0.3); border-radius:12px; padding:12px 14px; line-height:1.55;
  }
  .discussion{
    font-size:clamp(12px,1.3vw,13.5px); color:var(--muted); line-height:1.6; margin-top:12px;
    padding-top:12px; border-top:1px solid var(--line);
  }
  .discussion .dlabel{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--mint); margin-bottom:6px;
  }
  .chart-card{
    background:#f2f1ef;
    border-radius:18px;
    padding:clamp(10px,1.6vw,16px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06);
  }
  .chart-card img{ width:100%; height:auto; display:block; border-radius:8px;}
  .chart-card .cap{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#66645f; padding:8px 4px 2px; text-align:center; letter-spacing:.04em;
  }

  /* ---------- summary findings ---------- */
  .big-stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:20px;}
  @media (max-width:760px){ .big-stat-row{grid-template-columns:1fr;} }
  .big-stat{
    background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:clamp(18px,2.4vw,26px);
    text-align:left; position:relative; overflow:hidden;
  }
  .big-stat::after{
    content:""; position:absolute; right:-30px; top:-30px; width:100px; height:100px; border-radius:50%;
    background:radial-gradient(circle, rgba(123,97,255,0.25), transparent 70%);
  }
  .big-stat .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(34px,4.4vw,50px); color:var(--text);}
  .big-stat .n .pct{color:var(--coral);}
  .big-stat p{font-size:clamp(12.5px,1.4vw,14.5px); color:var(--muted); margin:8px 0 0; line-height:1.5;}

  /* ---------- limitations / suggestions list ---------- */
  .tick-list{ list-style:none; margin:16px 0 0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .tick-list li{ display:flex; gap:12px; align-items:flex-start; font-size:clamp(13px,1.5vw,15.5px); color:var(--text); line-height:1.55;}
  .tick-list .mark{
    flex-shrink:0; width:20px; height:20px; border-radius:6px; margin-top:2px;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700;
  }
  .tick-list.limit .mark{ background:rgba(255,93,108,0.18); color:var(--coral); border:1px solid rgba(255,93,108,0.4);}
  .tick-list.suggest .mark{ background:rgba(94,234,212,0.16); color:var(--mint); border:1px solid rgba(94,234,212,0.4);}

  /* ---------- references ---------- */
  .ref-list{ columns:2; column-gap:32px; margin-top:14px;}
  @media (max-width:760px){ .ref-list{columns:1;} }
  .ref-item{
    break-inside:avoid; font-size:clamp(11.5px,1.25vw,13px); color:var(--muted);
    line-height:1.55; margin-bottom:14px; padding-left:20px; position:relative;
  }
  .ref-item .rn{ position:absolute; left:0; top:0; color:var(--violet); font-family:'IBM Plex Mono',monospace; font-size:11px;}
  .ref-item b{color:var(--text); font-weight:500;}

  /* ---------- closing ---------- */
  .closing{ text-align:left; }
  .closing h1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(32px,6vw,66px); margin:0 0 16px;}
  .closing .sub{color:var(--muted); font-size:clamp(14px,1.8vw,18px); max-width:56ch; margin-bottom:26px;}
  .closing .contact{ display:flex; gap:22px; flex-wrap:wrap; font-family:'IBM Plex Mono',monospace; font-size:clamp(12px,1.4vw,14px); color:var(--mint);}

  /* ---------- tap zones + controls ---------- */
  .tap-zone{ position:absolute; top:0; bottom:0; width:22%; z-index:10; cursor:pointer; }
  .tap-zone.left{ left:0; }
  .tap-zone.right{ right:0; }

  #controls{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:space-between;
    padding: clamp(10px,2vh,18px) clamp(14px,3vw,28px);
    z-index:40;
  }
  .navbtn{
    pointer-events:auto;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    width:44px;height:44px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition: background .15s, transform .15s, border-color .15s;
  }
  .navbtn:hover{ background:var(--panel-2); border-color:rgba(123,97,255,0.5); }
  .navbtn:active{ transform:scale(.92); }
  .navbtn svg{width:18px;height:18px;}
  .navbtn.disabled{ opacity:.3; pointer-events:none; }

  #controls .mid{
    display:flex; align-items:center; gap:14px;
  }
  #fsbtn{
    pointer-events:auto;
    background:transparent; border:1px solid var(--line); color:var(--muted);
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em;
    padding:9px 14px; border-radius:100px; cursor:pointer; display:flex; align-items:center; gap:7px;
    text-transform:uppercase;
  }
  #fsbtn:hover{ color:var(--text); border-color:rgba(123,97,255,0.5); }
  #fsbtn svg{width:13px;height:13px;}

  .swipe-hint{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted);
    opacity:.55; pointer-events:none; display:none;
  }
  @media (max-width:760px){ .swipe-hint{ display:block; } }

  ::selection{ background:var(--violet); color:#fff; }

  /* ---------- small-screen compaction ---------- */
  @media (max-width:600px){
    #topbar .brand .brand-text{ display:none; }
    #fsbtn .label{ display:none; }
    #fsbtn{ padding:9px; }
    .slide{ padding: clamp(14px,4vh,28px) clamp(14px,5vw,28px); }
    .stat-grid{ grid-template-columns:1fr; gap:10px; }
    .chip-grid{ grid-template-columns:1fr; gap:10px; }
    .big-stat-row{ gap:12px; }
    .obj-list{ gap:10px; }
    .headline-stat{ flex-wrap:wrap; }
    .headline-stat .desc{ max-width:none; }
    .chart-card{ padding:8px; }
    .discussion, .insight{ padding:10px 12px; }
    .title-slide .badge-row{ gap:8px; }
  }
  @media (max-width:400px){
    h1.slide-title{ font-size:clamp(22px,7vw,30px); }
    .title-slide h1{ font-size:clamp(26px,9vw,40px); }
    .eyebrow{ margin-bottom:8px; }
  }

  @media (prefers-reduced-motion: reduce){
    .slide{ transition:opacity .01s linear; transform:none !important; }
  }
</style>
</head>
<body>
<div id="app">

  <div id="storybar"></div>

  <div id="topbar">
    <div class="brand"><span class="dot"></span> <span class="brand-text">FOMO · Empirical Study</span></div>
    <div class="counter"><b id="curNum">01</b> / <span id="totNum">19</span></div>
  </div>

  <div id="viewport"></div>

  <div class="tap-zone left" id="tapLeft" aria-label="Previous slide"></div>
  <div class="tap-zone right" id="tapRight" aria-label="Next slide"></div>

  <div id="controls">
    <button class="navbtn" id="prevBtn" aria-label="Previous slide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="mid">
      <button id="fsbtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <span class="label">Fullscreen</span>
      </button>
    </div>
    <button class="navbtn" id="nextBtn" aria-label="Next slide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <div class="swipe-hint">SWIPE TO NAVIGATE</div>

</div>

<script>
/* ============================ SLIDE CONTENT ============================ */
const slides = [

{type:'title', html:`
  <div class="title-slide">
    <div class="kicker">Empirical Research · N = 216</div>
    <h1>The Fear of<br><span>Missing Out</span></h1>
    <div class="sub">An empirical study on FOMO among young adults — examining awareness, attitudes, and the digital, educational, and policy factors that shape how India's youth experience it.</div>
    <div class="author-row">
      <div class="avatar">RG</div>
      <div>
        <div class="author-name">Rhea Ajith George</div>
        <div class="author-role">Author</div>
      </div>
    </div>
    <div class="badge-row">
      <div class="badge">SAMPLE · 216 RESPONDENTS</div>
      <div class="badge">METHOD · QUANTITATIVE SURVEY</div>
      <div class="badge">CONTEXT · INDIA</div>
    </div>
  </div>
`},

{type:'basic', html:`
  <div class="eyebrow">Abstract</div>
  <h1 class="slide-title">Mapping awareness of <span class="accent">FOMO</span> across India's youth</h1>
  <p class="lede">The study examines the factors shaping awareness and attitudes toward the Fear of Missing Out across diverse demographic groups, and identifies gaps in current preventive frameworks — combining education, technology, and policy analysis.</p>
  <div class="stat-grid">
    <div class="stat-card">
      <div class="label">Aim</div>
      <div class="value violet">Awareness</div>
      <p>Examine factors influencing awareness &amp; attitudes toward FOMO across demographic groups.</p>
    </div>
    <div class="stat-card">
      <div class="label">Sample</div>
      <div class="value">216</div>
      <p>Respondents recruited via convenience sampling across age, gender, education &amp; occupation.</p>
    </div>
    <div class="stat-card">
      <div class="label">Moderate–high awareness</div>
      <div class="value coral">68%</div>
      <p>Of respondents demonstrated moderate to high awareness of FOMO.</p>
    </div>
    <div class="stat-card">
      <div class="label">Support tech intervention</div>
      <div class="value mint">54%</div>
      <p>Expressed support for enhanced technological interventions.</p>
    </div>
  </div>
`},

{type:'basic', html:`
  <div class="eyebrow">Introduction</div>
  <h1 class="slide-title">Why FOMO, and why now</h1>
  <div class="two-col">
    <div>
      <p class="lede" style="margin-bottom:14px;">FOMO — the anxiety that others are having rewarding experiences you're absent from — has grown alongside social media use among India's youth. This study analyzes its prevalence, determinants, and consequences within the Indian context, where social platform usage runs high among young people.</p>
      <p class="lede">It builds on Chauhan &amp; Prajapati (2026), who linked FOMO to psychological distress among <i>extroverted</i> young adults. This study turns instead to <b style="color:var(--text)">introverted</b> young adults, exploring how FOMO interacts with social media use and digital literacy.</p>
    </div>
    <div class="pillbox">
      <h3>Study grounding</h3>
      <ul>
        <li>216 participants across urban and rural India</li>
        <li>Varied educational backgrounds &amp; socio-economic status</li>
        <li>Legal &amp; social-science framing, largely under-explored in India</li>
        <li>Builds on Chauhan &amp; Prajapati's (2026) theoretical framework</li>
      </ul>
    </div>
  </div>
`},

{type:'basic', html:`
  <div class="eyebrow">Objectives of the Study</div>
  <h1 class="slide-title">Four questions driving the research</h1>
  <ol class="obj-list">
    <li><span class="obj-num">01</span><p>Evaluate the potential of technology in preventing and addressing FOMO among young adults.</p></li>
    <li><span class="obj-num">02</span><p>Identify vulnerabilities and challenges in existing frameworks that govern FOMO-related interventions.</p></li>
    <li><span class="obj-num">03</span><p>Assess the impact of awareness campaigns and digital platforms in educating the public about FOMO.</p></li>
    <li><span class="obj-num">04</span><p>Recommend evidence-based policy interventions and best practices to address FOMO effectively.</p></li>
  </ol>
`},

{type:'basic', html:`
  <div class="eyebrow">Review of Literature</div>
  <h1 class="slide-title">Positioned within a growing — but Western-heavy — body of work</h1>
  <p class="lede">FOMO research spans social pressure, loneliness, digital engagement, and mental health outcomes, but has been concentrated in Western contexts. This study responds directly to Chauhan &amp; Prajapati (2026), and situates itself among 14 further studies on FOMO's links to anxiety, addiction, and decision-making.</p>
  <div class="two-col">
    <div class="pillbox">
      <h3>Theoretical anchor</h3>
      <p><b style="color:var(--text)">Chauhan &amp; Prajapati (2026)</b> — Fear of Missing Out and Psychological Distress among Extroverted Young Adults. This study extends that lens to introverted young adults and digital literacy.</p>
    </div>
    <div class="pillbox">
      <h3>Recurring themes in the literature</h3>
      <ul>
        <li>Social pressure &amp; emotional anxiety (Borvonsachoti et al., 2026)</li>
        <li>Loneliness &amp; social media addiction (Luth &amp; Maryam, 2024)</li>
        <li>Decisional conflict &amp; rumination (Bijoy, 2025)</li>
        <li>Impulse buying &amp; doomscrolling (Kamble et al., 2026; Julaihi &amp; Ahmad, 2024)</li>
      </ul>
    </div>
  </div>
  <p class="insight" style="margin-top:16px; max-width:none;">The gap: limited India-specific, introvert-focused, digitally-contextualized research — which this study addresses directly.</p>
`},

{type:'basic', html:`
  <div class="eyebrow">Methodology</div>
  <h1 class="slide-title">How the data was collected &amp; tested</h1>
  <p class="lede">A descriptive, empirical research design enabling systematic data collection and quantitative analysis of real-world attitudes and behaviours toward FOMO.</p>
  <div class="chip-grid">
    <div class="chip"><div class="k">Design</div><div class="v">Empirical / descriptive, quantitative</div></div>
    <div class="chip"><div class="k">Sample</div><div class="v">216 respondents, convenience sampling</div></div>
    <div class="chip"><div class="k">Instrument</div><div class="v">Structured questionnaire, 5-point Likert scale</div></div>
    <div class="chip"><div class="k">Secondary sources</div><div class="v">Peer-reviewed journals, govt reports, statistical databases</div></div>
    <div class="chip"><div class="k">Analysis software</div><div class="v">SPSS v21</div></div>
    <div class="chip"><div class="k">Statistical tests</div><div class="v">Chi-square · ANOVA · Pearson correlation</div></div>
    <div class="chip"><div class="k">Independent variables</div><div class="v">Age · gender · education · area · occupation</div></div>
    <div class="chip"><div class="k">Dependent variable</div><div class="v">Awareness &amp; attitude toward FOMO</div></div>
  </div>
`},

 question:'"How would you rate your overall awareness of FOMO?" — by gender',
 title:'Awareness varies sharply by gender',

 insight:'Employed respondents report high concern too (29.89%), suggesting the effect isn\u2019t limited to any one work status.',
 discussion:'Results: concern peaks among the unemployed (42.01% "very high"), followed by the employed (29.89% "high") and retired (28.10% "very low") — no responses were logged for business owners or students. Discussion: the pattern points to economic precarity as a plausible amplifier of FOMO-related concern, since unemployment may heighten sensitivity to perceived social and opportunity loss.'},

 discussion:'Results: rural respondents are split between neutral (41.84%) and strongly disagree (12.21%) trust, while semi-urban respondents lean toward strongly agree (19.20%) — no urban responses were captured in this sample. Discussion: the rural clustering around "neutral" reads less as confidence and more as unfamiliarity with current measures, reinforcing the case for expanding rural-targeted outreach identified elsewhere in the study.'},

 question:'"How would you rate the effectiveness of policies on FOMO?" — by age',

 discussion:'Results: perceived policy effectiveness stays flat and low across age groups, topping out at 21.10% (36–55, rating 8) and never exceeding a fifth of any cohort at the highest ratings. Discussion: the absence of any strong consensus — positive or negative — suggests policy on FOMO is not yet salient enough for respondents to form a firm view, which is itself a finding: visibility of interventions may be as much of a gap as their substance.'},

  <ul class="tick-list limit">

const references = [
["Chauhan, D. & Prajapati, H. (2026)","Fear of Missing Out (FOMO) and Psychological Distress among Extroverted Young Adults."],
["Borvonsachoti, P. et al. (2026)","Unpacking the Mechanism of FOMO: Social Pressure, Emotional Anxiety & Digital Engagement."],

["Kamble, D. et al. (2026)","The Impact of FOMO on Impulse Buying Behaviour among Young Consumers."],
["Adiki, S. et al. (2025)","A Study on Scrolling and Suffering — Social Media's Role in FOMO."],
["Pandey, S. (2026)","Social Media Fatigue, FOMO, and Psychological Well-Being among Young Adults."],

["Julaihi, A. & Ahmad, N. (2024)","Doomscrolling and FOMO: Exploring their Roles in Anxiety."],
["Juniarga, A. & Nastiti, D. (2025)","Influence of Conformity & Life Satisfaction on FoMO Among Students."],
["Andini, K. & Maryam, E. (2025)","Affiliation Needs, Loneliness, and FOMO in Adolescents."],
["Sung, J. & Yun, J. (2022)","Type Characteristics of FoMO according to Live Commerce UI Elements."],
["Putri, E. (2024)","Effectiveness of REB Group Counseling in Reducing FOMO."],

/* ============================ RENDER ============================ */
const viewport = document.getElementById('viewport');
const storybar = document.getElementById('storybar');
let current = 0;

function refsHTML(){
  let items = references.map((r,i)=>`
    <div class="ref-item"><span class="rn">${String(i+1).padStart(2,'0')}</span><b>${r[0]}</b> — ${r[1]}</div>
  `).join('');
  return `
    <div class="eyebrow">References</div>
    <h1 class="slide-title">Grounded in the wider literature</h1>
    <div class="ref-list">${items}</div>
  `;
}

function dataSlideHTML(s){
  return `
    <div class="data-slide">
      <div class="data-copy">
        <div class="fignum">Figure ${s.fig} of 7</div>
        <h2>${s.title}</h2>
        <div class="question">${s.question}</div>
        <div class="headline-stat">
          <div class="num">${s.stat}</div>
          <div class="desc">${s.statdesc}</div>
        </div>
        <div class="insight">${s.insight}</div>
        <div class="discussion"><span class="dlabel">Results &amp; Discussion</span>${s.discussion}</div>
      </div>
      <div class="chart-card">
        <img src="${s.img}" alt="Chart: ${s.title}" loading="lazy">
        <div class="cap">SURVEY DATA · N = 216</div>
      </div>
    </div>
  `;
}

slides.forEach((s, i)=>{
  const el = document.createElement('div');
  el.className = 'slide';
  el.dataset.index = i;
  let inner;
  if(s.type === 'data') inner = dataSlideHTML(s);
  else if(s.type === 'refs') inner = refsHTML();
  else inner = s.html;
  el.innerHTML = `<div class="slide-inner">${inner}</div>`;
  viewport.appendChild(el);

  const seg = document.createElement('div');
  seg.className = 'seg';
  seg.dataset.index = i;
  seg.addEventListener('click', (e)=>{ e.stopPropagation(); goTo(i); });
  storybar.appendChild(seg);
});

document.getElementById('totNum').textContent = String(slides.length).padStart(2,'0');

function render(){
  const slideEls = viewport.querySelectorAll('.slide');
  slideEls.forEach((el,i)=>{
    el.classList.remove('active','prev');
    if(i === current) el.classList.add('active');
    else if(i < current) el.classList.add('prev');
    el.scrollTop = 0;
  });

  const segs = storybar.querySelectorAll('.seg');
  segs.forEach((seg,i)=>{
    seg.classList.remove('done','active');
    seg.style.removeProperty('--fill');
    if(i < current) seg.classList.add('done');
    else if(i === current) seg.classList.add('active');
  });

  document.getElementById('curNum').textContent = String(current+1).padStart(2,'0');
  document.getElementById('prevBtn').classList.toggle('disabled', current===0);
  document.getElementById('nextBtn').classList.toggle('disabled', current===slides.length-1);

  history.replaceState(null, '', '#' + (current+1));
}

function goTo(i){
  current = Math.max(0, Math.min(slides.length-1, i));
  render();
}
function next(){ if(current < slides.length-1) goTo(current+1); }
function prev(){ if(current > 0) goTo(current-1); }

document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('tapRight').addEventListener('click', next);
document.getElementById('tapLeft').addEventListener('click', prev);

document.addEventListener('keydown', (e)=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){ e.preventDefault(); next(); }
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
  if(e.key === 'Home'){ goTo(0); }
  if(e.key === 'End'){ goTo(slides.length-1); }
  if(e.key === 'f' || e.key === 'F'){ toggleFullscreen(); }
});

/* touch swipe */
let touchStartX = null, touchStartY = null;
document.getElementById('app').addEventListener('touchstart', (e)=>{
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
document.getElementById('app').addEventListener('touchend', (e)=>{
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.4){
    if(dx < 0) next(); else prev();
  }
  touchStartX = null; touchStartY = null;
}, {passive:true});

/* fullscreen (great for smart boards) */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.().catch(()=>{});
  } else {
    document.exitFullscreen?.();
  }
}
document.getElementById('fsbtn').addEventListener('click', toggleFullscreen);

/* deep-link on load */
(function initFromHash(){
  const h = parseInt(location.hash.replace('#',''), 10);
  if(!isNaN(h) && h >= 1 && h <= slides.length) current = h-1;
})();

render();
</script>
